name: Build & Publish Release APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Release APK & Create Public Link
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Rename APK for Distribution
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/OSIS_Management.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OSIS_Management_APK
          path: dist/OSIS_Management.apk
          retention-days: 30

      - name: Create Public GitHub Release & Link
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.0.0
          name: OSIS Management Release v1.0.0
          body: |
            ## 📱 Unduh Aplikasi OSIS Management
            Klik file `OSIS_Management.apk` di bawah untuk langsung mengunduh dan menginstal aplikasi di HP Android.
          files: dist/OSIS_Management.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
