name: Build & Release (Android, AAB, Windows)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android (APK & AAB)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Build Android Release AAB
        run: flutter build appbundle --release

      - name: Prepare Android Artifacts
        run: |
          mkdir -p dist
          find build/app/outputs/flutter-apk -name "*release.apk" -exec cp {} dist/OSIS_Management.apk \;
          find build/app/outputs/bundle -name "*release.aab" -exec cp {} dist/OSIS_Management.aab \;

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-builds
          path: dist/*
          retention-days: 14

  build-windows:
    name: Build Windows Application
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Windows Executable
        run: flutter build windows --release

      - name: Package Windows App (ZIP)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          $relDir = Get-ChildItem -Path "build\windows" -Recurse -Directory | Where-Object { $_.Name -eq "Release" -and $_.FullName -like "*runner*" } | Select-Object -First 1
          if (-not $relDir) {
            $relDir = Get-ChildItem -Path "build\windows" -Recurse -Directory -Filter "Release" | Select-Object -First 1
          }
          if ($relDir) {
            Write-Host "Packaging release from: $($relDir.FullName)"
            Compress-Archive -Path "$($relDir.FullName)\*" -DestinationPath "dist/OSIS_Management_Windows_x64.zip" -Force
          } else {
            Write-Error "Release directory not found under build/windows!"
            exit 1
          }

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist/OSIS_Management_Windows_x64.zip
          retention-days: 14

  publish-release:
    name: Publish Unified GitHub Release
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-builds
          path: release_assets

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: release_assets

      - name: Create Unified GitHub Release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v1.0.6-build${{ github.run_number }}
          name: OSIS Management v1.0.6 (Build #${{ github.run_number }})
          body: |
            ## 🚀 OSIS Management v1.0.6 — Unified Release
            Hasil kompilasi otomatis multi-platform untuk aplikasi OSIS Management.

            ### 📦 Download File Aplikasi:
            - **Android APK**: [`OSIS_Management.apk`](https://github.com/${{ github.repository }}/releases/download/v1.0.6-build${{ github.run_number }}/OSIS_Management.apk) (Langsung instal di smartphone Android)
            - **Google Play App Bundle**: [`OSIS_Management.aab`](https://github.com/${{ github.repository }}/releases/download/v1.0.6-build${{ github.run_number }}/OSIS_Management.aab) (Untuk upload ke Google Play Console)
            - **Windows Application**: [`OSIS_Management_Windows_x64.zip`](https://github.com/${{ github.repository }}/releases/download/v1.0.6-build${{ github.run_number }}/OSIS_Management_Windows_x64.zip) (Ekstrak & jalankan `osis_jurnal.exe` di PC/Laptop)

            ---
            - **Commit**: `${{ github.sha }}`
            - **Workflow Run**: #${{ github.run_number }}
          files: |
            release_assets/OSIS_Management.apk
            release_assets/OSIS_Management.aab
            release_assets/OSIS_Management_Windows_x64.zip
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
