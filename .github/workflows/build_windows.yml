name: Build & Publish Windows App

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Application
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Windows Executable
        run: flutter build windows --release

      - name: Package Windows App (ZIP)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "dist/OSIS_Management_Windows_x64.zip" -Force

      - name: Upload Windows Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OSIS_Management_Windows_x64
          path: dist/OSIS_Management_Windows_x64.zip
          retention-days: 30

      - name: Create Public GitHub Release & Link
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        continue-on-error: true
        with:
          tag_name: v1.0.4-win-build${{ github.run_number }}
          name: OSIS Management Windows v1.0.4 (Build #${{ github.run_number }})
          body: |
            ## 💻 Unduh Aplikasi OSIS Management untuk Windows
            Unduh dan ekstrak file `OSIS_Management_Windows_x64.zip`, lalu buka file `osis_jurnal.exe` untuk menjalankan aplikasi di PC Windows.
            
            - **Platform**: Windows 10 / 11 (x64)
            - **Build Number**: #${{ github.run_number }}
            - **Commit**: ${{ github.sha }}
          files: dist/OSIS_Management_Windows_x64.zip
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
